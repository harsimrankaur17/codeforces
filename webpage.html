
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Starry Night</title>
	<style>
		:root{--bg1:#060610;--bg2:#0b0520;--accent:#7b3cff}
		html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:#eceff4}
		/* Background gradient */
		body{
			background: radial-gradient(ellipse at 10% 10%, rgba(123,60,255,0.12), transparent 10%),
									linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 60%);
			overflow:hidden;
		}

		/* Header */
		header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 32px;z-index:50;background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent);backdrop-filter: blur(6px);}
		.brand{display:flex;align-items:center;gap:12px}
		.logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#3b1b6f);box-shadow:0 6px 20px rgba(123,60,255,0.15);display:flex;align-items:center;justify-content:center;font-weight:700}
		nav a{color:rgba(255,255,255,0.85);text-decoration:none;margin-left:18px;font-weight:600}

		/* Star layers */
		.stars, .stars2, .stars3{position:fixed;inset:0;z-index:0;pointer-events:none}
		.stars:before, .stars2:before, .stars3:before{content:"";position:absolute;inset:0;background-repeat:repeat;background-size:contain;opacity:0.9}

		/* Generated star textures using radial-gradients */
		.stars:before{background-image:radial-gradient(2px 2px at 10% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 10%, #fff, transparent), radial-gradient(1.2px 1.2px at 70% 60%, #fff, transparent);opacity:0.7;transform:translateZ(0);filter:blur(.2px)}
		.stars2:before{background-image:radial-gradient(1.2px 1.2px at 20% 80%, #dfe7ff, transparent), radial-gradient(1px 1px at 80% 30%, #e8e8ff, transparent);opacity:0.5;filter:blur(.6px)}
		.stars3:before{background-image:radial-gradient(0.9px 0.9px at 50% 40%, #fff, transparent), radial-gradient(0.8px 0.8px at 30% 60%, #fff, transparent);opacity:0.35;filter:blur(1px)}

		/* Motion animations */
		@keyframes drift {from{transform:translateX(0)} to{transform:translateX(-2000px)}}
		@keyframes drift-slow {from{transform:translateX(0)} to{transform:translateX(-1000px)}}
		@keyframes twinkle {0%,100%{opacity:0.8}50%{opacity:0.2}}

		.stars:before{animation:drift 80s linear infinite}
		.stars2:before{animation:drift-slow 120s linear infinite}
		.stars3:before{animation:drift 200s linear infinite}

		/* Foreground nebula / purple glow */
		.nebula{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(400px 300px at 15% 20%, rgba(123,60,255,0.12), transparent 12%), radial-gradient(600px 420px at 85% 80%, rgba(60,20,120,0.08), transparent 18%);mix-blend-mode:screen}

		/* Center content */
		main{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 24px 40px}
		h1{font-size:clamp(28px,6vw,64px);margin:0 0 8px;background:linear-gradient(90deg,#fff,c #d1c8ff);-webkit-background-clip:text;color:transparent}
		p.lead{color:rgba(235,235,255,0.78);max-width:900px;text-align:center;font-size:18px}

		/* Subtle shooting star */
		.shooting{position:fixed;top:20%;left:80%;width:2px;height:120px;background:linear-gradient(180deg,rgba(255,255,255,0.9), rgba(123,60,255,0.0));transform:rotate(-25deg);opacity:0;z-index:20}
		@keyframes shoot{0%{opacity:0;transform:translateX(0) rotate(-25deg)}10%{opacity:1}100%{opacity:0;transform:translateX(-1400px) rotate(-25deg)}}
		.shooting{animation:shoot 5s cubic-bezier(.2,.8,.2,1) infinite 2s}

		/* Footer small */
		footer{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:40;color:rgba(255,255,255,0.6);font-size:13px}

		@media (max-width:600px){header{padding:12px 18px}.logo{width:40px;height:40px}}
	</style>
</head>
<body>
	<header>
		<div class="brand">
			<div class="logo">CF</div>
			<div>
				<div style="font-weight:700">Codeforces</div>
				<div style="font-size:12px;color:rgba(255,255,255,0.6)">Starry Theme</div>
			</div>
		</div>
		<nav>
			<a href="#">Home</a>
			<a href="#">Contests</a>
			<a href="#">Problems</a>
			<a href="#">Profile</a>
		</nav>
	</header>

	<div class="stars"></div>
	<div class="stars2"></div>
	<div class="stars3"></div>
	<div class="nebula"></div>
	<div class="shooting"></div>

	<main>
		<div id="loginForm" class="login-container">
			<h1>Welcome to the Starry Night</h1>
			<form onsubmit="handleLogin(event)">
				<div class="form-group">
					<label for="username">Username</label>
					<input type="text" id="username" name="username" placeholder="Enter your username" required>
				</div>
				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" placeholder="Enter your password" required>
				</div>
				<button type="submit" class="login-btn">Login</button>
			</form>
		</div>
		<div id="welcomeSection" class="welcome-container" style="display:none;">
			<h1>Welcome, <span id="welcomeUsername"></span>!</h1>
			<p class="lead">You have successfully logged in to the Starry Night.</p>
		</div>
	</main>

	<footer>© Codeforces — Starry Theme</footer>
</body>
</html>
